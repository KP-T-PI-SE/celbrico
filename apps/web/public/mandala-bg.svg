<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none" stroke="#f97316" stroke-width="1.5">
  <g transform="translate(400,400)">
    <circle r="380" stroke-dasharray="4 8" opacity="0.4"/>
    <circle r="320" opacity="0.6"/>
    <circle r="260" stroke-dasharray="12 6"/>
    <circle r="200"/>
    <circle r="140" stroke-dasharray="8 4"/>
    <circle r="80"/>
    <circle r="20" fill="#f97316" fill-opacity="0.1"/>
    
    <!-- 8 Petal Rotations -->
    <g id="petal-group">
      <path d="M 0 0 C -40 -100 -60 -200 0 -260 C 60 -200 40 -100 0 0" fill="#f97316" fill-opacity="0.03"/>
      <path d="M 0 0 C -25 -60 -35 -120 0 -160 C 35 -120 25 -60 0 0"/>
      <circle cx="0" cy="-280" r="8" fill="#eab308" fill-opacity="0.2"/>
      <circle cx="0" cy="-220" r="5"/>
    </g>
    <use href="#petal-group" transform="rotate(45)"/>
    <use href="#petal-group" transform="rotate(90)"/>
    <use href="#petal-group" transform="rotate(135)"/>
    <use href="#petal-group" transform="rotate(180)"/>
    <use href="#petal-group" transform="rotate(225)"/>
    <use href="#petal-group" transform="rotate(270)"/>
    <use href="#petal-group" transform="rotate(315)"/>

    <!-- Additional diamond details -->
    <g id="diamond">
      <polygon points="0,-180 15,-200 0,-220 -15,-200" fill="#eab308" fill-opacity="0.1"/>
    </g>
    <use href="#diamond" transform="rotate(22.5)"/>
    <use href="#diamond" transform="rotate(67.5)"/>
    <use href="#diamond" transform="rotate(112.5)"/>
    <use href="#diamond" transform="rotate(157.5)"/>
    <use href="#diamond" transform="rotate(202.5)"/>
    <use href="#diamond" transform="rotate(247.5)"/>
    <use href="#diamond" transform="rotate(292.5)"/>
    <use href="#diamond" transform="rotate(337.5)"/>
  </g>
</svg>
